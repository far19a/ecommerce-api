server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${ORDER_DB_USERNAME:order}
    password: ${ORDER_DB_PASSWORD:order}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
